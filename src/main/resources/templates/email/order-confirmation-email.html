<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;border-radius:12px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
                <tr>
                    <td th:style="'background-color:' + ${colorPrimary} + ';padding:0;'">
                        <div style="padding:20px 24px 16px;text-align:center;">
                            <img th:if="${logoUrl}" th:src="${logoUrl}" th:alt="${siteTitle}"
                                 th:style="'max-height:64px;display:inline-block;color:' + ${colorSecondary} + ';font-weight:bold;font-family:Arial,Helvetica,sans-serif;'"/>
                            <h1 th:unless="${logoUrl}" th:text="${siteTitle}"
                                style="color:#ffffff;margin:0;font-size:20px;font-family:Arial,Helvetica,sans-serif;">Festivalshop</h1>
                        </div>

                        <div style="padding:16px 20px 24px;">
                            <div th:style="'background-color:#ffffff;border-radius:12px;padding:24px;color:#222222;font-size:16px;line-height:1.6;border-top:4px solid ' + ${colorAccent} + ';'"
                                 th:utext="${contentHtml}">
                                Inhalt
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
