<div xmlns:th="http://www.thymeleaf.org" style="margin-top:1.5em;padding-top:1.5em;border-top:1px solid #dddddd;font-size:13px;color:#333333;">
    <p><strong>Zahlungsstatus:</strong> <span th:text="${paymentStatusText}">Zahlung erhalten.</span></p>

    <p>
        <strong>Verkäufer:</strong><br/>
        <span th:if="${companyName}" th:text="${companyName}">Firma</span><br/>
        <span th:if="${companyStreet}" th:text="${companyStreet}">Straße</span><br/>
        <span th:if="${companyPostalCode} or ${companyCity}" th:text="${companyPostalCode} + ' ' + ${companyCity}">PLZ Ort</span><br/>
        <span th:if="${companyCountry}" th:text="${companyCountry}">Land</span><br/>
        <span th:if="${contactEmail}" th:text="${contactEmail}">kontakt@example.com</span>
    </p>

    <p>
        Die vollständigen AGB, die Widerrufsbelehrung und das Muster-Widerrufsformular findest
        du als PDF im Anhang dieser E-Mail.
    </p>
</div>
