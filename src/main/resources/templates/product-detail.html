<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${product.title() + ' – Festivalshop'})}"></head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="shop-panel product-page" th:with="variants=${product.variants()}, single=${variants != null and variants.size() == 1}">
    <a class="back-link" th:href="@{/}">Alle Produkte</a>
    <div class="product-detail">
        <div class="gallery" th:with="gallery=${product.images()}, cover=${#lists.isEmpty(gallery) ? product.thumbnail() : gallery[0].url()}">
            <div class="detail-media">
                <img th:if="${cover}" id="product-photo" th:src="${cover}" th:alt="${product.title()}"/>
                <span class="image-missing" th:unless="${cover}">Produktbild folgt</span>
            </div>
            <div class="thumbs" th:if="${gallery != null and gallery.size() > 1}" aria-label="Produktansichten">
                <a th:each="image, loop : ${gallery}" th:href="${image.url()}"
                   th:aria-current="${loop.first} ? 'true' : null"
                   th:aria-label="|Ansicht ${loop.count} von ${loop.size} anzeigen|">
                    <img th:src="${image.url()}" alt="" loading="lazy"/>
                </a>
            </div>
        </div>
        <div class="purchase">
            <h1 th:text="${product.title()}">Produktname</h1>
            <div class="detail-price" aria-live="polite" aria-atomic="true">
                <div id="initial-price"><span th:replace="~{fragments/price :: price(${initialPrice}, ${product.hasPriceRange()})}"></span></div>
                <div th:each="variant : ${variants}" th:attr="data-price-for=${variant.id()}" hidden>
                    <span th:replace="~{fragments/price :: price(${variantPrices.get(variant.id())}, false)}"></span>
                </div>
            </div>
            <div class="order-note" th:if="${product.isPreorder() or product.isPickupOnly()}">
                <strong th:if="${product.isPreorder()}">Vorbestellung<span th:if="${product.preorderDeadline() != null}" th:text="| bis ${product.preorderDeadlineFormatted()}|"></span></strong>
                <span th:if="${product.isPickupOnly()}">
                    Nur Abholung auf dem Festival<span th:if="${product.pickupPeriodFormatted() != null}" th:text="| (${product.pickupPeriodFormatted()})|"></span>
                </span>
            </div>
            <dl class="product-meta" th:if="${product.material() != null or product.manufacturer() != null or !#lists.isEmpty(variants)}">
                <div th:if="${product.material() != null}">
                    <dt>Material</dt>
                    <dd th:text="${product.material()}">Material</dd>
                </div>
                <div th:if="${product.manufacturer() != null}">
                    <dt>Hersteller</dt>
                    <dd th:text="${product.manufacturer()}">Hersteller</dd>
                </div>
                <div th:if="${single and variants[0].sku() != null}">
                    <dt>Artikelnummer</dt>
                    <dd th:text="${variants[0].sku()}">SKU</dd>
                </div>
                <div th:unless="${single}">
                    <dt>Artikelnummer</dt>
                    <dd id="initial-sku" hidden>Bitte Variante wählen</dd>
                    <dd th:each="variant : ${variants}" th:if="${variant.sku() != null}" th:attr="data-sku-for=${variant.id()}" hidden th:text="${variant.sku()}"></dd>
                </div>
            </dl>
            <form class="purchase-form" th:unless="${#lists.isEmpty(variants)}" th:action="@{/warenkorb/hinzufuegen}" method="post">
                <fieldset th:if="${!single or variants[0].hasDisplayTitle()}">
                    <legend th:text="${product.variantLabel()}">Größe</legend>
                    <div class="choices">
                        <label class="choice" th:each="variant : ${variants}">
                            <input type="radio" name="variantId" required th:value="${variant.id()}"
                                   th:checked="${single and !variant.isSoldOut()}" th:disabled="${variant.isSoldOut()}"/>
                            <span class="choice-label">
                                <strong th:text="${variant.title()}">M</strong>
                                <small th:if="${variant.isSoldOut()}">Ausverkauft</small>
                                <small th:if="${!variant.isSoldOut() and variant.isLowStock()}" th:text="|Nur noch ${variant.inventory_quantity()}|"></small>
                            </span>
                            <noscript th:if="${product.hasPriceRange()}"><span th:replace="~{fragments/price :: price(${variantPrices.get(variant.id())}, false)}"></span></noscript>
                        </label>
                    </div>
                </fieldset>
                <input th:if="${single and !variants[0].hasDisplayTitle()}" type="hidden" name="variantId" th:value="${variants[0].id()}"/>
                <button type="submit" class="btn buy" th:disabled="${product.isSoldOut()}"
                        th:text="${product.isSoldOut() ? 'Ausverkauft' : 'In den Warenkorb'}">In den Warenkorb</button>
            </form>
            <p th:if="${#lists.isEmpty(variants)}">Dieses Produkt ist aktuell nicht bestellbar.</p>
            <p th:if="${product.subtitle()}" th:text="${product.subtitle()}"></p>
            <p class="description" th:if="${product.description()}" th:text="${product.description()}"></p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
