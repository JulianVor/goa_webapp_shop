<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${product.title()})}"></head>
<body>
<div class="page-bg"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="product-detail">
        <div class="product-detail-media">
            <span class="discount-badge" th:if="${product.lowestPrice() != null and product.lowestPrice().isOnSale()}"
                  th:text="'-' + ${product.lowestPrice().discountPercent()} + '%'">-25%</span>
            <div class="product-gallery" th:if="${not #lists.isEmpty(product.images())}">
                <img class="product-detail-image" th:each="image : ${product.images()}" th:src="${image.url()}" th:alt="${product.title()}"/>
            </div>
            <img class="product-detail-image" th:if="${#lists.isEmpty(product.images()) and product.thumbnail() != null}"
                 th:src="${product.thumbnail()}" th:alt="${product.title()}"/>
        </div>
        <div>
            <h1 class="product-detail-title" th:text="${product.title()}">Produktname</h1>
            <p class="product-detail-subtitle" th:if="${product.subtitle()}" th:text="${product.subtitle()}">Untertitel</p>
            <p class="product-detail-price" th:if="${product.lowestPrice() != null}">
                <span class="price-original" th:if="${product.lowestPrice().isOnSale()}"
                      th:text="${#numbers.formatDecimal(product.lowestPrice().original_amount(), 1, 2)} + ' ' + ${product.lowestPrice().currency_code().toUpperCase()}">20,00 EUR</span>
                <span th:classappend="${product.lowestPrice().isOnSale()} ? 'price-sale'"
                      th:text="${#numbers.formatDecimal(product.lowestPrice().calculated_amount(), 1, 2)} + ' ' + ${product.lowestPrice().currency_code().toUpperCase()}">15,00 EUR</span>
            </p>

            <p class="product-detail-description" th:if="${product.description()}" th:text="${product.description()}">Beschreibung</p>

            <p class="preorder-notice" th:if="${product.isPreorder()}">
                Vorbestellung – Annahmeschluss: <strong th:text="${product.preorderDeadlineFormatted()}">01.01.2027 um 00:00 Uhr</strong>
                <span th:if="${product.isPickupOnly()}"> · Nur Abholung, kein Versand</span>
            </p>

            <form th:action="@{/warenkorb/hinzufuegen}" method="post" th:if="${not #lists.isEmpty(product.variants())}">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <select class="variant-select" name="variantId" th:if="${#lists.size(product.variants()) > 1}">
                    <option th:each="variant : ${product.variants()}" th:value="${variant.id()}"
                            th:disabled="${variant.isSoldOut()}"
                            th:text="${variant.optionLabel()}">Variante</option>
                </select>
                <input type="hidden" th:if="${#lists.size(product.variants()) == 1}" name="variantId" th:value="${product.variants()[0].id()}"/>
                <button type="submit" class="btn"
                        th:disabled="${#lists.size(product.variants()) == 1 and product.variants()[0].isSoldOut()}"
                        th:text="${#lists.size(product.variants()) == 1 and product.variants()[0].isSoldOut()} ? 'Ausverkauft' : 'In den Warenkorb'">In den Warenkorb</button>
            </form>
            <p th:if="${#lists.isEmpty(product.variants())}">Dieses Produkt ist aktuell nicht bestellbar.</p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
