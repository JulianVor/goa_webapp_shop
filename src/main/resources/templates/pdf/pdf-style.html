<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="style">
<style>
    @page { size: A4; margin: 2.5cm 2cm; }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #222222; }
    h1 { font-size: 16pt; margin: 0 0 1em; }
    h2, h3 { font-size: 12pt; margin: 1.2em 0 0.3em; }
    p { margin: 0 0 0.8em; }
    .seller-block { color: #444444; margin-bottom: 1.8em; font-size: 10pt; }
    .version-note { color: #777777; font-size: 9pt; margin-top: 1.8em; border-top: 1px solid #dddddd; padding-top: 0.6em; }
</style>
</th:block>
</body>
</html>
