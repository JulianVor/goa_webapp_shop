<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Warenkorb – Festivalshop')}"></head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="shop-panel cart-panel">
    <a class="back-link" th:href="@{/}">Alle Produkte</a>
    <h1>Warenkorb</h1>
    <p class="flash-success" role="status" th:if="${success}" th:text="${success}"></p>
    <p class="flash-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <div th:if="${cart == null or #lists.isEmpty(cart.items())}" class="empty-state">
        <p>Dein Warenkorb ist leer.</p>
        <a class="btn" th:href="@{/}">Weiter einkaufen</a>
    </div>
    <th:block th:if="${cart != null and not #lists.isEmpty(cart.items())}">
        <ul class="cart-lines">
            <li class="cart-line" th:each="item : ${cart.items()}" th:with="product=${cartProducts.get(item.product_id())}">
                <div class="line-photo" th:if="${item.thumbnail() != null or (product != null and product.imageForCard() != null)}">
                    <img th:src="${item.thumbnail() ?: product.imageForCard()}" alt=""/>
                </div>
                <div class="line-info">
                    <strong th:text="${item.title()}">Produktname</strong>
                    <span th:if="${item.variant_title() != null and item.variant_title() != 'Default option value' and item.variant_title() != 'Default variant'}" th:text="${item.variant_title()}"></span>
                    <span th:if="${product != null and product.isPickupOnly()}">Nur Festivalabholung</span>
                </div>
                <strong class="line-price"><th:block th:replace="~{fragments/price :: amount(${item.subtotal()}, ${cart.currency_code()})}"/></strong>
                <div class="line-actions">
                    <form th:action="@{/warenkorb/menge}" method="post" class="quantity-form">
                        <input type="hidden" name="lineItemId" th:value="${item.id()}"/>
                        <label>Menge <input type="number" name="quantity" min="1" required th:max="${maxQuantities.get(item.id())}" th:value="${item.quantity()}"/></label>
                        <button class="text-button" type="submit">Ändern</button>
                    </form>
                    <form th:action="@{/warenkorb/entfernen}" method="post">
                        <input type="hidden" name="lineItemId" th:value="${item.id()}"/>
                        <button type="submit" class="text-button" th:aria-label="|Entfernen: ${item.title()} ${item.variant_title() ?: ''}|">Entfernen</button>
                    </form>
                </div>
            </li>
        </ul>
        <p class="cart-total"><strong>Gesamt</strong><strong><th:block th:replace="~{fragments/price :: amount(${cart.total()}, ${cart.currency_code()})}"/></strong></p>
        <a class="btn" th:href="@{/kasse}">Zur Kasse</a>
    </th:block>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
