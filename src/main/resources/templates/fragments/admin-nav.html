<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="admin-sidebar" th:fragment="admin-nav(active)">
    <a class="admin-brand" th:href="@{/admin}"><span>Shop Admin</span></a>
    <nav class="admin-sidebar-nav">
        <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'"><span class="admin-sidebar-icon">🏠</span> Dashboard</a>
        <a th:href="@{/admin/bestellbestaetigung}" th:classappend="${active == 'bestellbestaetigung'} ? 'active'"><span class="admin-sidebar-icon">📧</span> Bestellbestätigung</a>
        <a th:href="@{/admin/widerrufe}" th:classappend="${active == 'widerrufe'} ? 'active'"><span class="admin-sidebar-icon">↩️</span> Widerrufe</a>
        <a th:href="@{/admin/settings}" th:classappend="${active == 'settings'} ? 'active'"><span class="admin-sidebar-icon">⚙️</span> Einstellungen</a>
    </nav>
    <div class="admin-sidebar-footer">
        <a th:href="@{/}" target="_blank">Shop ansehen ↗</a>
        <form th:action="@{/logout}" method="post" class="inline-form">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="link-button">Abmelden</button>
        </form>
    </div>
</aside>
</body>
</html>
