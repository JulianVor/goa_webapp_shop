<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Festivalshop – Grumbrechtstraßen Open Air')}"></head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="catalog">
    <h1 class="poster-title">Festivalshop</h1>
    <p th:if="${#lists.isEmpty(products)}" class="shop-panel empty-state">Aktuell sind keine Produkte verfügbar. Schau bald wieder vorbei!</p>
    <div th:unless="${#lists.isEmpty(products)}" class="product-grid"
         th:classappend="${#lists.size(products) <= 2 or #lists.size(products) == 4} ? 'grid-pair'">
        <a class="product-card shop-panel" th:each="product : ${products}" th:href="@{'/produkte/' + ${product.id()}}"
           th:with="price=${priceDisplays.get(product.id())}, image=${product.imageForCard()}">
            <div class="card-media">
                <img th:if="${image}" th:src="${image}" alt=""/>
                <span class="image-missing" th:unless="${image}">Produktbild folgt</span>
                <div class="badges">
                    <span class="badge" th:if="${product.isSoldOut()}">Ausverkauft</span>
                    <span class="badge" th:if="${product.isPreorder() and !product.isSoldOut()}">Vorbestellung</span>
                    <span class="badge sale" th:if="${price != null and price.isOnSale()}"
                          th:text="'−' + ${price.discountPercent()} + ' %'">−25 %</span>
                </div>
            </div>
            <div class="card-copy">
                <h2 th:text="${product.title()}">Produktname</h2>
                <div th:replace="~{fragments/price :: price(${price}, ${product.hasPriceRange()})}"></div>
                <p th:if="${product.subtitle() != null and !product.isPreorder()}" th:text="${product.subtitle()}"></p>
                <p th:if="${product.isPreorder() and product.preorderDeadline() != null}">Bestellbar bis <span th:text="${product.preorderDeadlineFormatted()}"></span></p>
                <p th:if="${product.isPickupOnly()}">Nur Abholung auf dem Festival</p>
            </div>
        </a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
