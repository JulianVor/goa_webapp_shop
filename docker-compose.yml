services:
  shop-app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SHOP_DB_HOST:-db}:5432/${SHOP_DB_NAME:-life_webapp_shop}
      SPRING_DATASOURCE_USERNAME: ${SHOP_DB_USER:-life_webapp_shop}
      SPRING_DATASOURCE_PASSWORD: ${SHOP_DB_PASSWORD:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      MEDUSA_STORE_API_URL: ${MEDUSA_STORE_API_URL:-http://medusa:9000}
      MEDUSA_ADMIN_URL: ${MEDUSA_ADMIN_URL:-https://shop-admin.heimfeld.life/app}
      MEDUSA_PUBLISHABLE_API_KEY: ${MEDUSA_PUBLISHABLE_API_KEY:-}
      MEDUSA_DEFAULT_COUNTRY_CODE: ${MEDUSA_DEFAULT_COUNTRY_CODE:-de}
      # Where goa_webapp's GET /api/branding is fetched from (colors/fonts/background/logo
      # of the currently active edition) - fetched live at startup and every
      # BRANDING_REFRESH_INTERVAL_MS afterwards, see GoaWebappBrandingClient. Defaults to
      # goa_webapp's container name on the shared "proxy" network below (both this app's
      # and goa_webapp's containers sit on it) rather than its public domain, to avoid a
      # pointless round-trip through Caddy/TLS for a same-host, server-to-server call -
      # adjust if goa_webapp's actual container/port differs.
      GOA_WEBAPP_URL: ${GOA_WEBAPP_URL:-http://life_webapp-app-1:8080}
      BRANDING_REFRESH_INTERVAL_MS: ${BRANDING_REFRESH_INTERVAL_MS:-300000}
      # Publishable key (pk_...) from the Stripe Dashboard - safe client-side, embedded in
      # the checkout page for Stripe.js. Must be from the SAME Stripe account/mode
      # (test/live) as goa_webapp_shop_admin's STRIPE_API_KEY.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Must match goa_webapp_shop_admin's registered Stripe payment provider id exactly -
      # only needs changing if that project's medusa-config.ts payment provider id changes.
      STRIPE_PROVIDER_ID: ${STRIPE_PROVIDER_ID:-pp_stripe_stripe}
      THYMELEAF_CACHE: ${THYMELEAF_CACHE:-true}
    ports:
      - "${SHOP_APP_PORT:-8081}:8080"
    networks:
      - proxy
      - db-net

networks:
  # Caddy's own network - lets Caddy reach this container by its service name
  # ("shop-app"). Usually NOT the same network goa_webapp's Postgres is on - find both
  # with `docker inspect <goa_webapp-container> --format '{{range $n,$c :=
  # .NetworkSettings.Networks}}{{$n}}{{"\n"}}{{end}}'`.
  proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:-fotosvorju-proxy}
  # The network goa_webapp's own containers (app + Postgres) sit on - usually Compose's
  # auto-created default network for that project, e.g. "life_webapp_default". Lets this
  # app reach the shared Postgres container by name (SHOP_DB_HOST, e.g. "life_webapp-db-1").
  db-net:
    external: true
    name: ${DB_NETWORK_NAME:-life_webapp_default}
