services:
  shop-app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SHOP_DB_HOST:-db}:5432/${SHOP_DB_NAME:-goa_webapp_shop}
      SPRING_DATASOURCE_USERNAME: ${SHOP_DB_USER:-shop}
      SPRING_DATASOURCE_PASSWORD: ${SHOP_DB_PASSWORD:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      MEDUSA_STORE_API_URL: ${MEDUSA_STORE_API_URL:-http://medusa:9000}
      MEDUSA_ADMIN_URL: ${MEDUSA_ADMIN_URL:-https://shop-admin.heimfeld.life/app}
      MEDUSA_PUBLISHABLE_API_KEY: ${MEDUSA_PUBLISHABLE_API_KEY:-}
      MEDUSA_DEFAULT_COUNTRY_CODE: ${MEDUSA_DEFAULT_COUNTRY_CODE:-de}
      THYMELEAF_CACHE: ${THYMELEAF_CACHE:-true}
    ports:
      - "${SHOP_APP_PORT:-8081}:8080"
    networks:
      - shared

networks:
  # Joins the same Docker network goa_webapp's own containers and Caddy already use, so
  # this app can reach the shared Postgres container by its service name ("db" above, or
  # whatever SHOP_DB_HOST is set to) and Caddy can reach this one by "shop-app". Check
  # the actual name on your server with `docker network ls` / `docker inspect` on the
  # goa_webapp stack - it's whatever the user's own Canasta/Caddy setup created, "fotosvorju-proxy"
  # is just this deployment's example from the shop concept discussion, not a Docker default.
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-fotosvorju-proxy}
